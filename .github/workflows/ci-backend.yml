name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - '!backend/**/*.md'
      - .github/workflows/ci-backend.yml
      - .github/workflows/deploy-backend.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - '!backend/**/*.md'
      - .github/workflows/ci-backend.yml
      - .github/workflows/deploy-backend.yml

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # CI no recibe credenciales ni ejecuta las pruebas optativas de Supabase.
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      RUN_WORKFLOW_DB_TESTS: '0'
      APISPERU_TOKEN: ''
      GEOAPIFY_API_KEY: ''
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar uv y Python
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias bloqueadas
        run: uv sync --frozen
      - name: Ejecutar pruebas
        run: uv run --frozen pytest -q

  docker:
    name: Construir Docker del backend
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir sin publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: huancayo-limpio-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
