# En New > Blueprint: Blueprint Path = frontend/render.yaml.
# rootDir siempre se interpreta desde la raíz del repositorio existente.
services:
  - type: web
    name: huancayo-limpio-frontend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://gesti-n-residuos.onrender.com
