# Copia de referencia para organizar esta carpeta.
# GitHub ejecuta el archivo de la raiz: .github/workflows/deploy-frontend.yml
# Esta copia conserva las rutas del monorepositorio; no se ejecuta desde aqui.

name: CI y Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - '!frontend/**/*.md'
      - .github/workflows/deploy-frontend.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - '!frontend/**/*.md'
      - .github/workflows/deploy-frontend.yml

permissions:
  contents: read

# Una ejecución que ya solicitó el deploy debe poder terminar.
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Pruebas y compilación del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Ejecutar pruebas sin modo interactivo
        run: npm test -- --no-watch
      - name: Compilar producción
        run: npm run build

  deploy:
    name: Solicitar despliegue del frontend en Render
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Invocar Deploy Hook del frontend
        env:
          HOOK_RENDER_FRONTEND: ${{ secrets.HOOK_RENDER_FRONTEND }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HOOK_RENDER_FRONTEND" ]]; then
            echo '::error::Falta el secreto HOOK_RENDER_FRONTEND.'
            exit 1
          fi
          case "$HOOK_RENDER_FRONTEND" in
            https://api.render.com/deploy/*) ;;
            *) echo '::error::HOOK_RENDER_FRONTEND debe ser el Deploy Hook HTTPS completo de Render.'; exit 1 ;;
          esac
          # Desplegar exactamente el commit que pasó tests y build.
          curl --fail --silent --show-error --max-time 60 \
            --request POST --url-query "ref=$DEPLOY_SHA" \
            --output "$RUNNER_TEMP/render-frontend-deploy.json" \
            "$HOOK_RENDER_FRONTEND"
          echo "Render aceptó la solicitud para el commit $DEPLOY_SHA."
          echo 'Esto confirma la aceptación del hook, no la finalización del deploy.'
