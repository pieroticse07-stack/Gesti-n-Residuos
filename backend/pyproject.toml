[project]
name = "backend"
version = "0.1.0"
description = "API de personas del sistema de gestión de residuos sólidos"
readme = "README.md"
authors = [
    { name = "pieroticse07-stack", email = "pieroticse07@gmail.com" }
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
    "pillow>=12,<13",
]

[project.scripts]
backend = "backend.main:run"
init-db = "backend.init_db:run"

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.setuptools]
packages = ["backend", "backend.apis", "backend.repositories", "backend.schemas", "backend.services"]
package-dir = { backend = "src" }
include-package-data = false

[tool.setuptools.package-data]
backend = ["migrations/*.sql"]
